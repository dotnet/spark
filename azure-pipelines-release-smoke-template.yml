# Run against the final release packages, not source-build DLLs or unpackaged Workers.
parameters:
- name: sparkVersions
  type: object
  default:
  - '3.0.2'
  - '3.1.2'
  - '3.2.3'
  - '3.3.4'
  - '3.4.4'
  - '3.5.3'
  - '4.0.4'

stages:
- stage: ReleasePackageSmoke
  displayName: Spark release package smoke tests
  dependsOn: Build
  jobs:
  - ${{ each sparkVersion in parameters.sparkVersions }}:
    - ${{ each platform in split('Windows,Linux', ',') }}:
      - job: Smoke_${{ replace(sparkVersion, '.', '_') }}_${{ platform }}
        displayName: Spark ${{ sparkVersion }} packaged artifacts (${{ platform }})
        timeoutInMinutes: 30
        pool:
          name: Cosmos2MT-AzureDevOps-AgentPool
          ${{ if eq(platform, 'Windows') }}:
            image: 1es-pt-windows-2022
            os: windows
          ${{ else }}:
            image: 1es-pt-ubuntu-22
            os: linux
        steps:
        - checkout: self

        - task: DownloadPipelineArtifact@2
          displayName: Download final release packages
          inputs:
            artifact: DotnetSpark
            path: $(Pipeline.Workspace)/DotnetSpark

        - task: UseDotNet@2
          displayName: Use .NET 8 SDK
          inputs:
            packageType: sdk
            version: 8.x

        - task: JavaToolInstaller@0
          ${{ if eq(split(sparkVersion, '.')[0], '4') }}:
            displayName: Use JDK 17
          ${{ else }}:
            displayName: Use JDK 8
          inputs:
            ${{ if eq(split(sparkVersion, '.')[0], '4') }}:
              versionSpec: '17'
            ${{ else }}:
              versionSpec: '8'
            jdkArchitectureOption: x64
            jdkSourceOption: PreInstalled

        - ${{ if eq(platform, 'Windows') }}:
          - pwsh: |
              $hadoopVersion = '3.3.5'
              if ([version]'${{ sparkVersion }}' -lt [version]'3.3.0') {
                $hadoopVersion = '2.8.1'
              }
              ./eng/Initialize-HadoopWindows.ps1 -DestinationDirectory "$(Build.BinariesDirectory)/hadoop" -HadoopVersion $hadoopVersion
            displayName: Prepare Hadoop Windows tools

        - task: UniversalPackages@0
          displayName: Download Spark ${{ sparkVersion }}
          inputs:
            command: download
            downloadDirectory: $(Build.BinariesDirectory)/spark-distro
            feedsToUse: internal
            vstsFeed: ManagedOSS/Compute
            vstsFeedPackage: spark-distro
            vstsPackageVersion: ${{ sparkVersion }}

        - pwsh: |
            $sparkBinaryName = 'spark-${{ sparkVersion }}-bin-hadoop2.7'
            if ([version]'${{ sparkVersion }}' -ge [version]'3.3.0') {
              $sparkBinaryName = 'spark-${{ sparkVersion }}-bin-hadoop3'
            }
            $archives = @(Get-ChildItem -LiteralPath "$(Build.BinariesDirectory)/spark-distro" -Recurse -File -Filter "$sparkBinaryName.tgz")
            if ($archives.Count -ne 1) {
              throw "Expected one Spark distribution archive, found $($archives.Count)."
            }
            tar -xzf $archives[0].FullName -C "$(Build.BinariesDirectory)"
            if ($LASTEXITCODE -ne 0) { throw "Spark extraction failed: $LASTEXITCODE." }
            Write-Host "##vso[task.setvariable variable=ReleaseSmokeSparkHome]$(Build.BinariesDirectory)/$sparkBinaryName"
          displayName: Extract Spark distribution

        - pwsh: |
            if ($IsWindows) {
              $env:HADOOP_HOME = "$(Build.BinariesDirectory)/hadoop"
              $env:PATH = "$(Build.BinariesDirectory)/hadoop/bin;$env:PATH"
            }
            ./eng/Run-SparkReleaseSmokeTest.ps1 `
              -PackageDirectory "$(Pipeline.Workspace)/DotnetSpark" `
              -SparkHome "$(ReleaseSmokeSparkHome)" `
              -SparkVersion '${{ sparkVersion }}' `
              -WorkDirectory "$(Agent.TempDirectory)/spark-release-smoke-${{ sparkVersion }}-${{ platform }}-$(Build.BuildId)-$(System.JobAttempt)"
          displayName: Verify packaged Driver, Collect and scalar UDF
          timeoutInMinutes: 10
