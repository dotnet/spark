# Spark .NET build

trigger:
  batch: true
  branches:
    include:
    - main

variables:
  buildConfiguration: 'Release'
  _SignType: real
  _TeamName: DotNetSpark
  MSBUILDSINGLELOADCONTEXT: 1
  ArtifactPath: '$(Build.ArtifactStagingDirectory)\Microsoft.Spark.Binaries'
  managedOSSMavenFeed: ManagedOSS_PublicPackages
  managedOSSMavenFeedUrl: https://pkgs.dev.azure.com/msasg/ManagedOSS/_packaging/ManagedOSS_PublicPackages/maven/v1

  backwardCompatibleRelease: '2.0.0'
  forwardCompatibleRelease: '2.0.0'

  backwardCompatibleTestOptions_Windows_3_0: ""
  forwardCompatibleTestOptions_Windows_3_0: ""
  backwardCompatibleTestOptions_Linux_3_0: ""
  forwardCompatibleTestOptions_Linux_3_0: ""

  backwardCompatibleTestOptions_Windows_3_1: ""
  forwardCompatibleTestOptions_Windows_3_1: ""
  backwardCompatibleTestOptions_Linux_3_1: ""
  forwardCompatibleTestOptions_Linux_3_1: ""

  # Skip all forward/backward compatibility tests since Spark 3.2 and 3.5 are not supported before this release.
  backwardCompatibleTestOptions_Windows_3_2: "--filter FullyQualifiedName=NONE"
  forwardCompatibleTestOptions_Windows_3_2: $(backwardCompatibleTestOptions_Windows_3_2)
  backwardCompatibleTestOptions_Linux_3_2: $(backwardCompatibleTestOptions_Windows_3_2)
  forwardCompatibleTestOptions_Linux_3_2: $(backwardCompatibleTestOptions_Windows_3_2)

  backwardCompatibleTestOptions_Windows_3_3: "--filter FullyQualifiedName=NONE"
  forwardCompatibleTestOptions_Windows_3_3: $(backwardCompatibleTestOptions_Windows_3_3)
  backwardCompatibleTestOptions_Linux_3_3: $(backwardCompatibleTestOptions_Windows_3_3)
  forwardCompatibleTestOptions_Linux_3_3: $(backwardCompatibleTestOptions_Windows_3_3)
  
  backwardCompatibleTestOptions_Windows_3_5: "--filter FullyQualifiedName=NONE"
  forwardCompatibleTestOptions_Windows_3_5: $(backwardCompatibleTestOptions_Windows_3_5)
  backwardCompatibleTestOptions_Linux_3_5: $(backwardCompatibleTestOptions_Windows_3_5)
  forwardCompatibleTestOptions_Linux_3_5: $(backwardCompatibleTestOptions_Windows_3_5)

  backwardCompatibleTestOptions_Windows_4_0: "--filter FullyQualifiedName=NONE"
  forwardCompatibleTestOptions_Windows_4_0: $(backwardCompatibleTestOptions_Windows_4_0)
  backwardCompatibleTestOptions_Linux_4_0: $(backwardCompatibleTestOptions_Windows_4_0)
  forwardCompatibleTestOptions_Linux_4_0: $(backwardCompatibleTestOptions_Windows_4_0)

  # Azure DevOps variables are transformed into environment variables, with these variables we
  # avoid the first time experience and telemetry to speed up the build.
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

parameters:
# List of Spark versions to run E2E tests
- name: listOfE2ETestsSparkVersions
  type: object
  default:
  - '3.0.0'
  - '3.0.1'
  - '3.0.2'
  - '3.1.1'
  - '3.1.2'
  - '3.2.1'
  - '3.2.2'
  - '3.2.3'
  - '3.3.0'
  - '3.3.1'
  - '3.3.2'
  - '3.3.3'
  - '3.3.4'
  - '3.4.0'
  - '3.4.1'
  - '3.4.2'
  - '3.4.3'
  - '3.4.4'
  - '3.5.0'
  - '3.5.1'
  - '3.5.2'
  - '3.5.3'
  - '4.0.0'
  - '4.0.1'
  - '4.0.2'
  - '4.0.3'
  - '4.0.4'

# List of OS types to run E2E tests, run each test in both 'Windows' and 'Linux' environments
- name: listOfE2ETestsPoolTypes
  type: object
  default:
  - 'Windows'
  - 'Linux'

resources:
  repositories:
  - repository: forwardCompatibleRelease
    type: github
    endpoint: dotnet.spark
    name: dotnet/spark
    ref: refs/tags/v$(forwardCompatibleRelease)
  
  - repository: "WebXT.Pipeline.Templates"
    type: git
    name: Engineering Fundamentals/WebXT.Pipeline.Templates
    ref: refs/heads/main

extends:
  template: v1/WebXT.Official.EntryPoint.yml@WebXT.Pipeline.Templates
  parameters:
    settings:
      skipBuildTagsForGitHubPullRequests: true
    sdl:
      spotBugs:
        enabled: false
      suppression:
        suppressionFile: $(Build.SourcesDirectory)\.config\guardian\.gdnsuppress
      PSScriptAnalyzer:
        enabled: false
      credscan:
        enabled: false
      sourceRepositoriesToScan:
        exclude:
          - repository: forwardCompatibleRelease
      sourceAnalysisPool:
        name: Cosmos2MT-AzureDevOps-AgentPool
        image: 1es-pt-windows-2022
        os: windows
    pool:
      name: Cosmos2MT-AzureDevOps-AgentPool
      image: 1es-pt-windows-2022
      os: windows
    customBuildTags:
      - ES365AIMigrationTooling
          
    stages:
    - stage: Build
      displayName: Build Sources
      jobs:
      - job: Build
        templateContext:
          outputs:
            - output: pipelineArtifact
              artifactName: Microsoft.Spark.Binaries
              targetPath: $(Build.ArtifactStagingDirectory)
              displayName: '[PUBLISH] Microsoft.Spark.Binaries'

        steps:
        - task: MavenAuthenticate@0
          displayName: '[ENV] Maven Authenticate'
          inputs:
            artifactsFeeds: $(managedOSSMavenFeed)

        - pwsh: |
            ./eng/Configure-PackageSources.ps1 `
              -FeedName "$(managedOSSMavenFeed)" `
              -FeedUrl "$(managedOSSMavenFeedUrl)"
          displayName: '[ENV] Configure Maven mirror'

        - task: Maven@3
          displayName: 'Maven build src'
          inputs:
            mavenPomFile: src/scala/pom.xml
            options: '-Dmaven.resolver.transport=wagon'

        - pwsh: |
            $ErrorActionPreference = 'Stop'
            # SparkContext.addFile needs winutils even in local-mode Scala tests on Windows.
            $hadoopRoot = Join-Path "$(Build.BinariesDirectory)" 'hadoop'
            $hadoopBin = Join-Path $hadoopRoot 'bin'
            $archive = Join-Path "$(Build.BinariesDirectory)" 'hadoop-3.3.5.zip'
            Invoke-WebRequest -Uri 'https://github.com/SparkSnail/winutils/releases/download/hadoop-3.3.5/hadoop-3.3.5.zip' -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $hadoopRoot -Force
            New-Item -ItemType Directory -Path $hadoopBin -Force | Out-Null
            Copy-Item -LiteralPath (Join-Path $hadoopRoot 'hadoop-3.3.5\winutils.exe'), (Join-Path $hadoopRoot 'hadoop-3.3.5\hadoop.dll') -Destination $hadoopBin -Force

            # These Hadoop binaries depend on the VC++ 2010 x64 runtime, as in Windows E2E.
            $runtimeDll = Join-Path $env:SystemRoot 'System32\MSVCR100.dll'
            if (-not (Test-Path -LiteralPath $runtimeDll)) {
              $installer = Join-Path "$(Build.BinariesDirectory)" 'vcredist_x64.exe'
              Invoke-WebRequest -Uri 'https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x64.exe' -OutFile $installer
              $installation = Start-Process -FilePath $installer -ArgumentList '/q', '/norestart' -Wait -PassThru -WindowStyle Hidden
              if ($installation.ExitCode -notin @(0, 3010) -or -not (Test-Path -LiteralPath $runtimeDll)) {
                throw "VC++ 2010 x64 runtime installation failed (exit code $($installation.ExitCode))."
              }
            }

            & (Join-Path $hadoopBin 'winutils.exe') ls $hadoopBin
            if ($LASTEXITCODE -ne 0) {
              throw "Hadoop Windows tools failed to start (exit code $LASTEXITCODE)."
            }
          displayName: '[ENV] Prepare Hadoop for Windows Scala tests'

        - task: Maven@3
          displayName: 'Maven build Spark 4.0 bridge (JDK 17)'
          inputs:
            mavenPomFile: src/scala/microsoft-spark-4-0/pom.xml
            goals: 'clean package'
            options: '-Dmaven.resolver.transport=wagon'
            javaHomeOption: 'JDKVersion'
            jdkVersionOption: '1.17'
            jdkArchitectureOption: 'x64'
          env:
            HADOOP_HOME: $(Build.BinariesDirectory)\hadoop
            PATH: $(Build.BinariesDirectory)\hadoop\bin;$(PATH)

        - task: Maven@3
          displayName: 'Maven build benchmark'
          inputs:
            mavenPomFile: benchmark/scala/pom.xml
            options: '-Dmaven.resolver.transport=wagon'

        - script: build.cmd -pack
                    -c $(buildConfiguration)
                    -ci
                    /p:PublishSparkWorker=true
                    /p:SparkWorkerPublishDir=$(Build.ArtifactStagingDirectory)\Microsoft.Spark.Worker
          displayName: '.NET build'

        - pwsh: |
            ./eng/tests/Test-SparkReleasePackage.Tests.ps1
            ./eng/tests/New-SparkWorkerArchive.Tests.ps1
            ./eng/tests/Run-SparkReleaseSmokeTest.Tests.ps1
            $packages = @(Get-ChildItem -LiteralPath 'artifacts/packages/Release/NonShipping' -File |
              Where-Object { $_.Name -match '^Microsoft\.Spark\.[0-9].*\.nupkg$' })
            $jars = @(Get-ChildItem -LiteralPath 'src/scala/microsoft-spark-4-0/target' -Filter 'microsoft-spark-4-0_2.13-*.jar' -File)
            if ($packages.Count -ne 1 -or $jars.Count -ne 1) {
              throw 'Expected one core Microsoft.Spark package and one freshly built Spark 4 bridge.'
            }
            ./eng/Test-SparkReleasePackage.ps1 -PackagePath $packages[0].FullName -SparkJarPath $jars[0].FullName | Format-List
          displayName: 'Test release tooling and verify Spark 4 NuGet contents'

        - task: DotNetCoreCLI@2
          displayName: '.NET unit tests'
          inputs:
            command: test
            projects: '**/*UnitTest/*.csproj'
            arguments: '--configuration $(buildConfiguration)'

        - task: CopyFiles@2
          displayName: Stage Maven build jars
          inputs:
            sourceFolder: $(Build.SourcesDirectory)/src/scala
            contents: |
              microsoft-spark-3-0/target/microsoft-spark-3-0_2.12-*.jar
              microsoft-spark-3-1/target/microsoft-spark-3-1_2.12-*.jar
              microsoft-spark-3-2/target/microsoft-spark-3-2_2.12-*.jar
              microsoft-spark-3-3/target/microsoft-spark-3-3_2.12-*.jar
              microsoft-spark-3-4/target/microsoft-spark-3-4_2.12-*.jar
              microsoft-spark-3-5/target/microsoft-spark-3-5_2.12-*.jar
              microsoft-spark-4-0/target/microsoft-spark-4-0_2.13-*.jar
            targetFolder: $(Build.ArtifactStagingDirectory)/Jars

    - template: azure-pipelines-e2e-tests-template.yml
      parameters:
        backwardCompatibleRelease: $(backwardCompatibleRelease)
        forwardCompatibleRelease: $(forwardCompatibleRelease)
        managedOSSMavenFeed: $(managedOSSMavenFeed)
        managedOSSMavenFeedUrl: $(managedOSSMavenFeedUrl)
        tests:
        - ${{ each version in parameters.listOfE2ETestsSparkVersions }} :
          - version: ${{ version }}
            # Set compatible test to false for all test currently,
            # will need to refactor and update values in parameter if need to enalbe it per version.
            enableForwardCompatibleTests: false
            enableBackwardCompatibleTests: false
            jobOptions:
            - ${{ each pool in parameters.listOfE2ETestsPoolTypes }}:
              - pool: ${{ pool }}
                testOptions: ""
                backwardCompatibleTestOptions: $(backwardCompatibleTestOptions_${{ pool }}_${{ split(version, '.')[0] }}_${{ split(version, '.')[1] }})
                forwardCompatibleTestOptions: $(forwardCompatibleTestOptions_${{ pool }}_${{ split(version, '.')[0] }}_${{ split(version, '.')[1] }})
